<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доска публикаций</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Доска публикаций</h1>

        <div class="card">
            <h2>Управление публикациями</h2>
            <button id="load-btn">Загрузить публикации</button>
            <div id="status-message" class="status-msg hidden"></div>
        </div>

        <div class="card">
            <h2>Создать публикацию</h2>
            <form id="post-form">
                <div class="form-group">
                    <label for="post-title">Заголовок:</label>
                    <input type="text" id="post-title" placeholder="Введите заголовок">
                </div>

                <div class="form-group">
                    <label for="post-body">Текст:</label>
                    <textarea id="post-body" placeholder="Введите текст публикации" rows="4"></textarea>
                </div>

                <div id="error-message" class="error-msg hidden"></div>
                <div id="success-message" class="success-msg hidden"></div>

                <button type="submit" id="submit-btn">Создать публикацию</button>
            </form>
        </div>

        <div class="card">
            <h2>Список публикаций</h2>
            <p id="empty-state" class="empty-state">Список пуст</p>
            <ul id="posts-list" class="posts-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
